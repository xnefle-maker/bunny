<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>جزئیات بازی | ALBERIA</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/hero-forest.css">
  <link rel="icon" href="images/logo.svg" type="image/png">
  <style>
    .game-hero {
      position: relative;
      height: 420px;
      background-size: cover;
      background-position: center top;
      border-radius: var(--radius-lg);
      overflow: hidden;
      border: 1px solid var(--border-sakura);
      margin-top: 1.5rem;
    }
    .game-hero::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(to top, var(--bg-deep) 0%, rgba(18,10,16,0.7) 40%, transparent 70%);
    }
    .game-hero-content {
      position: absolute;
      bottom: 0;
      right: 0;
      left: 0;
      padding: 2rem;
      display: flex;
      gap: 1.75rem;
      align-items: flex-end;
    }
    .game-cover {
      width: 160px;
      border-radius: var(--radius-md);
      border: 2px solid var(--sakura-pink);
      box-shadow: var(--glow-pink);
      flex-shrink: 0;
    }
    .game-info h1 {
      font-family: var(--font-display);
      font-size: 2rem;
      color: var(--text-primary);
      margin-bottom: 0.35rem;
    }
    .game-meta {
      color: var(--sakura-soft);
      font-size: 0.95rem;
      margin-bottom: 0.75rem;
    }
    .game-platforms {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
    }
    .platform-tag {
      background: rgba(244,167,185,0.15);
      border: 1px solid var(--border-sakura);
      color: var(--sakura-soft);
      padding: 0.25rem 0.7rem;
      border-radius: 50px;
      font-size: 0.8rem;
    }
    .tabs {
      display: flex;
      gap: 0.5rem;
      margin: 1.75rem 0 1.25rem;
      border-bottom: 1px solid var(--border-sakura);
      overflow-x: auto;
      padding-bottom: 0.5rem;
    }
    .tab-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      padding: 0.6rem 1.1rem;
      border-radius: var(--radius-sm);
      cursor: pointer;
      font-size: 0.95rem;
      white-space: nowrap;
      transition: all 0.25s;
    }
    .tab-btn:hover { color: var(--sakura-soft); background: rgba(244,167,185,0.08); }
    .tab-btn.active {
      color: var(--sakura-pink);
      background: rgba(244,167,185,0.12);
      font-weight: 600;
    }
    .tab-content {
      display: none;
      background: var(--bg-card);
      border: 1px solid var(--border-sakura);
      border-radius: var(--radius-md);
      padding: 1.5rem;
      line-height: 1.8;
      color: var(--text-secondary);
    }
    .tab-content.active { display: block; }
    .tab-content h3 {
      color: var(--sakura-soft);
      margin-bottom: 0.75rem;
      font-size: 1.15rem;
    }
    .spoiler-box {
      background: rgba(224,122,143,0.1);
      border: 1px solid var(--sakura-deep);
      border-radius: var(--radius-md);
      padding: 1rem;
      margin-top: 1rem;
    }
    .spoiler-toggle {
      background: var(--sakura-deep);
      color: white;
      border: none;
      padding: 0.5rem 1rem;
      border-radius: 50px;
      cursor: pointer;
      font-size: 0.9rem;
    }
    .chars-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 1rem;
      margin-top: 1rem;
    }
    .char-card {
      background: var(--bg-elevated);
      border: 1px solid var(--border-sakura);
      border-radius: var(--radius-md);
      padding: 1rem;
      text-align: center;
    }
    .char-card h4 { color: var(--sakura-soft); margin-bottom: 0.35rem; }
  </style>
</head>
<body>
  <div class="sakura-petals" id="petals"></div>

  <header class="header">
    <div class="header-inner">
      <a href="index.html" class="logo-link" aria-label="ALBERIA - صفحه اصلی">
        <img src="images/logo.svg" alt="ALBERIA" class="logo-img">
      </a>
      <nav class="nav" aria-label="ناوبری اصلی">
        <a href="index.html" class="nav-link nav-home">ALBERIA</a>
        <a href="archive.html" class="nav-link">آرشیو</a>
        <a href="index.html#popular" class="nav-link">محبوب‌ها</a>
        <div class="nav-dropdown">
          <button type="button" class="nav-link nav-dropdown-toggle" id="genresMenuToggle" aria-expanded="false" aria-controls="genresMenu">ژانر <span class="dropdown-caret">▾</span></button>
          <div class="genres-menu" id="genresMenu" aria-label="ژانرهای بازی"></div>
        </div>
      </nav>
      <div class="header-tools">
        <div class="search-box">
          <span class="search-icon">⌕</span>
          <input type="search" class="search-input" placeholder="جستجوی نام بازی..." id="globalSearch" autocomplete="off" aria-label="جستجوی بازی">
          <div class="search-suggestions" id="searchSuggestions" role="listbox"></div>
        </div>
        <button class="creator-btn" id="creatorBtn" title="اطلاعات تماس" aria-label="اطلاعات تماس">
          <img src="images/albedo.webp" alt="اطلاعات تماس">
        </button>
      </div>
    </div>
  </header>

  <div class="panel-overlay" id="panelOverlay"></div>
  <aside class="creator-panel" id="creatorPanel">
    <button class="panel-close" id="panelClose">×</button>
    <div class="panel-content">
      <img src="images/albedo.webp" alt="Albedo" class="panel-avatar">
      <h2 class="panel-name">Albedo</h2>
      <p class="panel-role">سازنده ALBERIA</p>
      <div class="panel-info">
        <p>📧 <a href="mailto:JJuoz.C@gmail.com">JJuoz.C@gmail.com</a></p>
        <p>✈️ <a href="https://t.me/DragonCastles" target="_blank">@DragonCastles</a></p>
      </div>
    </div>
  </aside>

  <main class="container" style="padding-bottom: 3rem;" id="gameMain">
    <p style="text-align:center;padding:3rem;color:var(--text-muted)">در حال بارگذاری...</p>
  </main>

  <footer class="footer">
    <div class="footer-bottom" style="border:none;justify-content:center">
      <span>© ۱۴۰۴ ALBERIA ✿</span>
    </div>
  </footer>

  <button class="music-toggle" id="musicToggle">♪</button>

  <script src="js/data.js"></script>
  <script src="js/main.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const params = new URLSearchParams(window.location.search);
      const id = params.get('id');
      const game = ALL_GAMES.find(g => g.id === id);

      const main = document.getElementById('gameMain');
      if (!game) {
        main.innerHTML = `<div style="text-align:center;padding:4rem">
          <h2 style="color:var(--sakura-soft)">بازی پیدا نشد</h2>
          <a href="archive.html" class="btn-primary" style="margin-top:1rem">بازگشت به آرشیو</a>
        </div>`;
        return;
      }

      document.title = `${game.titleFa || game.title} | ALBERIA`;

      main.innerHTML = `
        <div class="game-hero" style="background-image:url('${game.cover}')">
          <div class="game-hero-content">
            <img src="${game.cover}" alt="${game.title}" class="game-cover"
                 onerror="this.src='https://via.placeholder.com/160x240/2c1c28/f4a7b9?text=Cover'">
            <div class="game-info">
              <h1>${game.titleFa || game.title}</h1>
              <div class="game-meta">
                ${game.year} 
                ${game.metacritic ? '• امتیاز منتقدان (Metacritic): ' + game.metacritic : ''}
              </div>
              <div class="game-platforms">
                ${(game.platforms || []).map(p => `<span class="platform-tag">${p}</span>`).join('')}
              </div>
            </div>
          </div>
        </div>

        <div class="tabs">
          <button class="tab-btn active" data-tab="intro">معرفی</button>
          <button class="tab-btn" data-tab="story">داستان</button>
          <button class="tab-btn" data-tab="characters">شخصیت‌ها</button>
          <button class="tab-btn" data-tab="gameplay">گیم‌پلی</button>
          <button class="tab-btn" data-tab="info">اطلاعات بازی</button>
        </div>

        <div class="tab-content active" id="tab-intro">
          <h3>معرفی</h3>
          <p>${game.description || 'توضیحات این بازی به‌زودی تکمیل می‌شود.'}</p>
          <p style="margin-top:1rem">ژانرها: ${(game.genres || []).join(' • ')}</p>
        </div>

        <div class="tab-content" id="tab-story">
          <h3>داستان (بدون اسپویل)</h3>
          <p>${game.description || 'داستان این بازی در حال آماده‌سازی است.'}</p>
          <div class="spoiler-box">
            <button class="spoiler-toggle" onclick="this.nextElementSibling.classList.toggle('hidden');this.textContent=this.nextElementSibling.classList.contains('hidden')?'نمایش داستان کامل (حاوی اسپویل)':'مخفی کردن'">
              نمایش داستان کامل (حاوی اسپویل)
            </button>
            <div class="hidden" style="margin-top:1rem">
              <p>داستان کامل این بازی هنوز نوشته نشده. در نسخه‌های بعدی اضافه خواهد شد.</p>
            </div>
          </div>
        </div>

        <div class="tab-content" id="tab-characters">
          <h3>شخصیت‌ها</h3>
          ${game.characters && game.characters.length ? `
            <div class="chars-grid">
              ${game.characters.map(c => `
                <div class="char-card">
                  <h4>${c}</h4>
                  <p style="font-size:0.85rem;color:var(--text-muted)">شخصیت مهم داستان</p>
                </div>
              `).join('')}
            </div>
          ` : '<p>اطلاعات شخصیت‌ها به‌زودی اضافه می‌شود.</p>'}
        </div>

        <div class="tab-content" id="tab-gameplay">
          <h3>گیم‌پلی</h3>
          <p>جزئیات گیم‌پلی این عنوان به‌زودی تکمیل می‌شود. سبک کلی: ${(game.genres || []).join('، ')}</p>
        </div>

        <div class="tab-content" id="tab-info">
          <h3>اطلاعات بازی</h3>
          <p><strong>سال انتشار:</strong> ${game.year}</p>
          <p><strong>پلتفرم‌ها:</strong> ${(game.platforms || []).join(' • ')}</p>
          <p><strong>امتیاز Metacritic:</strong> ${game.metacritic || 'نامشخص'}</p>
          <p><strong>حجم نصب:</strong> ${game.installSize || 'متغیر؛ بسته به پلتفرم و نسخه'}</p>
          <p style="margin-top:1rem;color:var(--text-muted)">سیستم موردنیاز و اطلاعات بیشتر در نسخه‌های بعدی اضافه خواهد شد.</p>
        </div>
      `;

      // Tab switching
      document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
          document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
          btn.classList.add('active');
          document.getElementById('tab-' + btn.dataset.tab).classList.add('active');
        });
      });
    });
  </script>
</body>
</html>
